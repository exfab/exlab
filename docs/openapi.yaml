              schema:
                type: object

  /analysis-runs:
    get:
      tags:
        - Analysis Runs
      summary: List analysis runs across projects
      description: Retrieves analysis runs across all projects the user has access to. Pass `canonical_only=true` and/or `tool=<name>` to filter for multi-project analytics.
      parameters:
        - in: query
          name: canonical_only
          schema:
            type: boolean
          description: When true, returns only the canonical (active) run per project.
        - in: query
          name: tool
          schema:
            type: string
          description: Optional case-insensitive filter by `tool_name` (e.g., `PhenoTypic`, `CellProfiler`, `Nextflow`).
      responses:
        '200':
          description: A list of analysis runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunListResponse'

  /projects/{identifier}/analysis-runs:
    get:
      tags:
        - Analysis Runs
      summary: List analysis run versions for a project
      description: Retrieves all analysis run versions (v1..vN) for a project, ordered newest version first.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project.
      responses:
        '200':
          description: Project analysis run version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunListResponse'
        '404':
          description: Project not found
    post:
      tags:
        - Analysis Runs
      summary: Register a new analysis run version
      description: Registers a new analysis pass for a project, auto-incrementing `version_number` and promoting the new run to `is_canonical = true` while superseding any previous canonical run.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRunCreate'
      responses:
        '201':
          description: Analysis run registered and marked canonical
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRun'
        '400':
          description: Invalid payload (e.g., empty storage_base_uri or dataset_checksum)
        '404':
          description: Project not found

  /projects/{identifier}/analysis-runs/sync:
    post:
      tags:
        - Analysis Runs
      summary: Auto-discover and register an analysis run from a bucket folder URI
      description: Lists all objects under the given `gs://` or `s3://` deliverables folder using the configured Storage Connection, indexes deliverable files, computes a manifest checksum, parses pipeline configuration & plate media metadata if present, and registers a new canonical analysis run version.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRunSyncRequest'
      responses:
        '201':
          description: Analysis run discovered and registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRun'
        '400':
          description: Invalid folder URI or storage connection not configured
        '404':
          description: Project or deliverable files not found in folder

  /projects/{identifier}/analysis-runs/canonical:
    get:
      tags:
        - Analysis Runs
      summary: Get canonical analysis run for a project
      description: Retrieves the currently active canonical analysis run (`is_canonical = true`) for a project (optionally scoped to a specific `tool`).
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project.
        - in: query
          name: tool
          schema:
            type: string
          description: Optional `tool_name` filter when a project uses multiple analysis tools (e.g., `PhenoTypic`, `Nextflow`).
      responses:
        '200':
          description: Canonical analysis run for the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRun'
        '404':
          description: Project not found or no canonical analysis run exists

  /projects/{identifier}/analysis-runs/canonical/signed-url:
    get:
      tags:
        - Analysis Runs
      summary: Resolve a signed download URL for an artifact in the canonical analysis run
      description: Resolves a 15-minute signed HTTPS download URL (`gs://` V4, `s3://` SigV4, or `https://` passthrough) for a specific artifact key in the project's canonical analysis run. Pass `redirect=true` via top-level browser navigation to receive an HTTP 302 redirect directly to the storage provider.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project.
        - in: query
          name: artifact
          required: true
          schema:
            type: string
          example: MeasureShape_parquet
          description: The artifact key from the run's `artifacts` map.
        - in: query
          name: redirect
          schema:
            type: boolean
          description: When true, responds with HTTP 302 Found redirecting directly to the signed HTTPS URL.
      responses:
        '200':
          description: Signed HTTPS URL metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSignedUrlResponse'
        '302':
          description: Redirect to the resolved HTTPS download URL
        '400':
          description: Missing artifact parameter or storage provider not configured
        '404':
          description: Project, canonical run, or artifact key not found

  /projects/{identifier}/analysis-runs/{version}:
    get:
      tags:
        - Analysis Runs
      summary: Get a specific analysis run version
      description: Retrieves a specific historical or canonical analysis run by its integer `version_number`.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project.
        - in: path
          name: version
          required: true
          schema:
            type: integer
            minimum: 1
          description: The 1-based version number of the analysis run.
        - in: query
          name: tool
          schema:
            type: string
          description: Optional `tool_name` filter when a project uses multiple analysis tools.
      responses:
        '200':
          description: Analysis run details for the requested version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRun'
        '400':
          description: Invalid version number
        '404':
          description: Project or run version not found
    delete:
      tags:
        - Analysis Runs
      summary: Delete an analysis run version
      description: Removes an analysis run registration from ExLab (without modifying external object storage files). Requires `admin`, `lab_manager`, `project_manager`, or being the user who registered the run. If the deleted run was canonical for its tool, the highest remaining version for that tool on the project is automatically promoted to canonical.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project.
        - in: path
          name: version
          required: true
          schema:
            type: integer
            minimum: 1
          description: The 1-based version number of the analysis run.
        - in: query
          name: tool
          schema:
            type: string
          description: Optional `tool_name` filter when a project uses multiple analysis tools.
      responses:
        '204':
          description: Analysis run deleted successfully
        '400':
          description: Invalid version number
        '403':
          description: Insufficient permissions to delete this analysis run
        '404':
          description: Project or run version not found

  /projects/{identifier}/analysis-runs/{version}/signed-url:
    get:
      tags:
        - Analysis Runs
      summary: Resolve a signed download URL for an artifact in a specific analysis run version
      description: Resolves a 15-minute signed HTTPS download URL (`gs://`, `s3://`, or `https://`) for an artifact in a specific historical or canonical run version.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project.
        - in: path
          name: version
          required: true
          schema:
            type: integer
            minimum: 1
          description: The 1-based version number of the analysis run.
        - in: query
          name: artifact
          required: true
          schema:
            type: string
          example: MeasureShape_parquet
          description: The artifact key from the run's `artifacts` map.
        - in: query
          name: redirect
          schema:
            type: boolean
          description: When true, responds with HTTP 302 Found redirecting directly to the signed HTTPS URL.
      responses:
        '200':
          description: Signed HTTPS URL metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSignedUrlResponse'
        '302':
          description: Redirect to the resolved HTTPS download URL
        '400':
          description: Invalid version or missing artifact parameter
        '404':
          description: Project, run version, or artifact key not found

  /projects/{identifier}/analysis-runs/{version}/canonical:
    put:
      tags:
        - Analysis Runs
      summary: Promote or roll back canonical analysis run version
      description: Sets the specified `version` as `is_canonical = true` for the project and demotes any previously canonical version to `is_canonical = false`.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project.
        - in: path
          name: version
          required: true
          schema:
            type: integer
            minimum: 1
          description: The 1-based version number to promote to canonical.
      responses:
        '200':
          description: Promoted analysis run details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRun'
        '400':
          description: Invalid version number
        '404':
          description: Project or run version not found

  /plates/{identifier}/media:
    get:
      tags:
        - Analysis Runs
        - Plates
      summary: Get time-sorted plate media URIs from the canonical analysis run
      description: Resolves the canonical analysis run for the plate's project and returns the time-sorted media items (images, overlays, documents, etc.) mapped to that plate without polluting `result_values` or the `/dashboard` endpoint.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the plate.
        - in: query
          name: include_signed_urls
          schema:
            type: boolean
          description: When true, includes a 15-minute `signed_url` on each media item for direct browser rendering.
      responses:
        '200':
          description: Time-sorted media URIs for the plate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlateMediaResponse'
        '404':
          description: Plate not found or project has no canonical analysis run

