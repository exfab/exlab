openapi: 3.0.3
info:
  title: Exlab API
  description: High-performance Laboratory Information Management System (LIMS) designed for synthetic biology and high-throughput laboratories.
  version: 1.0.0
servers:
  - url: /api/v1
tags:
  - name: Projects
    description: Project management and configuration
  - name: Samples
    description: Sample tracking and management
  - name: Plates
    description: Plate and layout management
  - name: Strains
    description: Strain and biological material management
  - name: Results
    description: Result categories, definitions, and values
  - name: Products
    description: Labware and reagent management
  - name: Communities
    description: Community and metagenomic management
  - name: Users
    description: User management
  - name: Auth
    description: Authentication and sessions
  - name: Wells
    description: Well assignment and updates
  - name: Settings
    description: System settings and configurations
  - name: External Databases
    description: External database definitions
  - name: Strain Links
    description: Links between strains and external databases
  - name: Analysis Runs
    description: Vendor-neutral versioned computational analysis runs, signed artifact downloads (HTTPS, GCS, S3/MinIO), and plate media
paths:
  /projects:
    get:
      tags:
        - Projects
      summary: List all projects
      description: Retrieves a list of all projects the user has access to.
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv]
          description: If specified as csv, returns the project list as a CSV file.
      responses:
        '200':
          description: A list of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  count:
                    type: integer
            text/csv:
              schema:
                type: string
                format: binary
    post:
      tags:
        - Projects
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'

  /projects/{identifier}:
    get:
      tags:
        - Projects
      summary: Get project details
      description: Retrieves a specific project by its ID, UUID, or Short ID.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project.
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    put:
      tags:
        - Projects
      summary: Update project
      description: Updates an existing project.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    delete:
      tags:
        - Projects
      summary: Archive project
      description: Archives a project, effectively performing a soft delete.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project to archive.
      responses:
        '204':
          description: Project archived

  /projects/{identifier}/users:
    get:
      tags:
        - Projects
      summary: Get project users
      description: Retrieves all users assigned to a project.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project.
      responses:
        '200':
          description: A list of assigned users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  count:
                    type: integer
    post:
      tags:
        - Projects
      summary: Assign user to project
      description: Assigns a user to a project. Requires Admin or Lab Manager role.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUserRequest'
      responses:
        '204':
          description: User assigned

  /projects/{identifier}/users/{user_identifier}:
    delete:
      tags:
        - Projects
      summary: Remove user from project
      description: Removes a user from a project. Requires Admin or Lab Manager role.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project.
        - in: path
          name: user_identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or email of the user to remove.
      responses:
        '204':
          description: User removed

  /projects/{identifier}/plates/plan:
    post:
      tags:
        - Projects
      summary: Plan multiple plates
      description: Generates a bulk experimental run across multiple plates using simple round-robin or randomized shuffling algorithms.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatePlanRequest'
      responses:
        '201':
          description: Run generated and plates created
          content:
            application/json:
              schema:
                type: object
                properties:
                  plates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plate'

  /projects/{identifier}/plates/transfer-map:
    post:
      tags:
        - Projects
      summary: Generate transfer map
      description: Creates a transfer map linking wells from a source plate to destination plates, output as a CSV.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferMapRequest'
      responses:
        '200':
          description: CSV file containing transfer map
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /projects/{identifier}/dashboard:
    get:
      tags:
        - Projects
      summary: Get project dashboard data
      description: Retrieves longitudinal matrix of samples, plates, values, definitions, strains, and wells.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Longitudinal matrix data
          content:
            application/json:
              schema:
                type: object

  /projects/{identifier}/results/export:
    get:
      tags:
        - Projects
      summary: Export project results
      description: Exports the longitudinal matrix data as a CSV file.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CSV file containing the exported results
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /samples:
    get:
      tags:
        - Samples
      summary: List all samples
      description: Retrieves a list of all samples across projects the user has access to.
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv]
          description: If specified as csv, returns the sample list as a CSV file.
      responses:
        '200':
          description: A list of samples
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sample'
                  count:
                    type: integer
            text/csv:
              schema:
                type: string
                format: binary

  /samples/{identifier}:
    get:
      tags:
        - Samples
      summary: Get sample details
      description: Retrieves a specific sample with detailed information.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The ID, UUID, or Short ID of the sample.
      responses:
        '200':
          description: Detailed sample view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleDetailed'
    put:
      tags:
        - Samples
      summary: Update sample
      description: Updates an existing sample.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleUpdate'
      responses:
        '200':
          description: Sample updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
    delete:
      tags:
        - Samples
      summary: Archive sample
      description: Soft deletes a sample.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Sample archived

  /samples/{identifier}/locations:
    get:
      tags:
        - Samples
      summary: Get sample locations
      description: Retrieves all the locations (plate and well) where a specific sample is stored.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sample locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SampleLocation'
                  count:
                    type: integer

  /samples/{identifier}/children:
    get:
      tags:
        - Samples
      summary: Get child samples
      description: Retrieves all samples derived from the given sample.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of child samples
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sample'
                  count:
                    type: integer

  /samples/{identifier}/children/dashboard:
    get:
      tags:
        - Samples
      summary: Get children dashboard
      description: Retrieves longitudinal matrix of child samples and their results.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Longitudinal matrix data
          content:
            application/json:
              schema:
                type: object

  /projects/{identifier}/samples:
    get:
      tags:
        - Projects
        - Samples
      summary: Get project samples
      description: Retrieves all samples associated with a specific project.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
        - in: query
          name: format
          schema:
            type: string
            enum: [csv]
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: sample_type
          schema:
            type: string
        - in: query
          name: strain_id
          schema:
            type: string
      responses:
        '200':
          description: A list of project samples
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sample'
                  count:
                    type: integer
            text/csv:
              schema:
                type: string
                format: binary
    post:
      tags:
        - Projects
        - Samples
      summary: Create project sample
      description: Creates a single new sample and associates it with a project.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleCreate'
      responses:
        '201':
          description: Sample created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'

  /projects/{identifier}/samples/bulk:
    post:
      tags:
        - Projects
        - Samples
      summary: Bulk create project samples (JSON)
      description: Creates multiple samples from a JSON payload for a given project.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleBulkCreateRequest'
      responses:
        '201':
          description: Samples created
          content:
            application/json:
              schema:
                type: object
                properties:
                  samples:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sample'

  /projects/{identifier}/samples/bulk-csv:
    post:
      tags:
        - Projects
        - Samples
      summary: Bulk create project samples (CSV)
      description: Creates multiple samples from a CSV payload for a given project.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        '201':
          description: Samples created
          content:
            application/json:
              schema:
                type: object
                properties:
                  samples:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sample'

  /plates:
    get:
      tags:
        - Plates
      summary: List all plates
      description: Retrieves a list of all plates.
      responses:
        '200':
          description: A list of plates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plate'
                  count:
                    type: integer
    post:
      tags:
        - Plates
      summary: Create a plate
      description: Creates a new plate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlateCreate'
      responses:
        '201':
          description: Plate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plate'

  /plates/{identifier}:
    get:
      tags:
        - Plates
      summary: Get plate details
      description: Retrieves a specific plate and its wells.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plate details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlateDetailed'

  /plates/{identifier}/export:
    get:
      tags:
        - Plates
      summary: Export plate
      description: Exports plate layout as a CSV.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CSV file of the plate layout
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /projects/{identifier}/plates:
    get:
      tags:
        - Projects
        - Plates
      summary: Get project plates
      description: Retrieves all plates associated with a specific project.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of project plates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plate'
                  count:
                    type: integer

  /projects/{identifier}/plates/bulk-csv:
    post:
      tags:
        - Projects
        - Plates
      summary: Bulk create project plates (CSV)
      description: Creates plates and assigns samples via CSV.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        '201':
          description: Plates created
    patch:
      tags:
        - Projects
        - Plates
      summary: Bulk update project plate layouts (CSV)
      description: Updates existing plates via CSV.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        '200':
          description: Plates updated

  /plates/{identifier}/layout-csv:
    post:
      tags:
        - Plates
      summary: Update plate layout (CSV)
      description: Updates the well layout of a plate via CSV.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        '200':
          description: Layout updated

  /plates/{identifier}/layout-json:
    post:
      tags:
        - Plates
      summary: Update plate layout (JSON)
      description: Updates the well layout of a plate via JSON.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PlateWellLayoutItem'
      responses:
        '200':
          description: Layout updated

  /plates/{identifier}/auto-fill:
    post:
      tags:
        - Plates
      summary: Auto-fill plate
      description: Automatically assigns samples to wells using a strategy.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlateAutoFillRequest'
      responses:
        '200':
          description: Plate filled

  /plates/{identifier}/unassign-bulk:
    post:
      tags:
        - Plates
      summary: Bulk unassign wells
      description: Unassigns samples from specific wells.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlateBulkUnassignRequest'
      responses:
        '200':
          description: Wells unassigned

  /plates/{identifier}/layout-matrix-csv:
    post:
      tags:
        - Plates
      summary: Update plate layout via Matrix CSV
      description: Updates the well layout of a plate via a matrix-formatted CSV.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        '200':
          description: Layout updated

  /plates/{identifier}/dashboard:
    get:
      tags:
        - Plates
      summary: Get plate dashboard data
      description: Retrieves longitudinal matrix of a plate's samples and results.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Longitudinal matrix data
          content:
            application/json:
              schema:
                type: object

  /strains:
    get:
      tags:
        - Strains
      summary: List all strains
      description: Retrieves a list of all strains.
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv]
          description: If specified as csv, returns the strain list as a CSV file.
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: genus
          schema:
            type: string
        - in: query
          name: species
          schema:
            type: string
      responses:
        '200':
          description: A list of strains
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Strain'
                  count:
                    type: integer
            text/csv:
              schema:
                type: string
                format: binary
    post:
      tags:
        - Strains
      summary: Create a strain
      description: Creates a new strain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrainCreate'
      responses:
        '201':
          description: Strain created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strain'

  /strains/{identifier}:
    get:
      tags:
        - Strains
      summary: Get strain details
      description: Retrieves a specific strain and its links and source samples.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Strain details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrainDetailed'
    put:
      tags:
        - Strains
      summary: Update strain
      description: Updates an existing strain.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrainUpdate'
      responses:
        '200':
          description: Strain updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strain'

  /strains/bulk:
    post:
      tags:
        - Strains
      summary: Bulk create strains (JSON)
      description: Creates multiple strains from a JSON payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrainBulkCreateRequest'
      responses:
        '201':
          description: Strains created
          content:
            application/json:
              schema:
                type: object
                properties:
                  strains:
                    type: array
                    items:
                      $ref: '#/components/schemas/Strain'

  /strains/bulk-csv:
    post:
      tags:
        - Strains
      summary: Bulk create strains (CSV)
      description: Creates multiple strains from a CSV payload.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        '201':
          description: Strains created
          content:
            application/json:
              schema:
                type: object
                properties:
                  strains:
                    type: array
                    items:
                      $ref: '#/components/schemas/Strain'

  /result-categories:
    get:
      tags:
        - Results
      summary: List all result categories
      description: Retrieves a list of all result categories.
      responses:
        '200':
          description: A list of result categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResultCategory'
                  count:
                    type: integer
    post:
      tags:
        - Results
      summary: Create a result category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultCategoryCreate'
      responses:
        '201':
          description: Result category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCategory'

  /result-categories/{identifier}:
    get:
      tags:
        - Results
      summary: Get result category details
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Result category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCategory'
    put:
      tags:
        - Results
      summary: Update result category
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultCategoryUpdate'
      responses:
        '200':
          description: Result category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCategory'

  /result-definitions:
    get:
      tags:
        - Results
      summary: List all result definitions
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: A list of result definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResultDefinition'
                  count:
                    type: integer
    post:
      tags:
        - Results
      summary: Create a result definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
