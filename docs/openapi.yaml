        - dataset_checksum
      properties:
        tool_name:
          type: string
          example: PhenoTypic
        tool_version:
          type: string
          example: 0.18.1
        storage_base_uri:
          type: string
          example: gs://exfab-data/data/ucr_phenotypic/UCR-029-E-D-Maresca/EXPERIMENT/2026-08-11/deliverables
        dataset_checksum:
          type: string
          example: md5:GGtzyFMj+5yU4wGXM4i+KA==
        pipeline_name:
          type: string
        pipeline_config:
          type: object
        artifacts:
          type: object
          additionalProperties:
            type: string
        summary_metrics:
          type: object
        plate_media:
          type: object
        notes:
          type: string

    AnalysisRunListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisRun'
        count:
          type: integer

    MediaPoint:
      type: object
      properties:
        time:
          type: integer
        uri:
          type: string
        label:
          type: string
        media_type:
          type: string
        signed_url:
          type: string
          description: Present when `include_signed_urls=true` is requested

    PlateMediaResponse:
      type: object
      properties:
        plate_short_id:
          type: string
        tool_name:
          type: string
        version_number:
          type: integer
        dataset_checksum:
          type: string
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaPoint'

    AnalysisSignedUrlResponse:
      type: object
      properties:
        project_short_id:
          type: string
        version_number:
          type: integer
        artifact:
          type: string
        uri:
          type: string
        signed_url:
          type: string
        expires_in:
          type: integer
          example: 900

    StorageConnectionsUpdate:
      type: object
      properties:
        gcs_service_account_json:
          type: string
        clear_gcs:
          type: boolean
        s3:
          type: object
          properties:
            endpoint_url:
              type: string
              example: https://minio.university.edu
            region:
              type: string
              example: us-east-1
            access_key_id:
              type: string
            secret_access_key:
              type: string
        clear_s3:
          type: boolean

    AnalysisRunSyncRequest:
      type: object
      required:
        - storage_base_uri
      properties:
        storage_base_uri:
          type: string
          example: gs://exfab-data/data/ucr_phenotypic/UCR-033-E-D_Linzer_Ganoderma/EXPERIMENT/2026-08-11/deliverables
        tool_name:
          type: string
          example: PhenoTypic
        notes:
          type: string
