components:
  schemas:
    Project:
      type: object
      properties:
        id:
          type: integer
        uid:
          type: string
        short_id:
          type: string
        name:
          type: string
        description:
          type: string
        contact_name:
          type: string
        owner:
          type: string
        status:
          type: string
        metadata:
          type: object
        created_at:
          type: number
        updated_at:
          type: number

    ProjectCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        contact_name:
          type: string
        owner:
          type: string
        status:
          type: string
        metadata:
          type: object
        short_id:
          type: string

    ProjectUpdate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        contact_name:
          type: string
        owner:
          type: string
        status:
          type: string
        metadata:
          type: object

    ProjectUserRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        uid:
          type: string
        email:
          type: string
        role:
          type: string
        created_at:
          type: number
        updated_at:
          type: number

    PlatePlanRequest:
      type: object
      required:
        - replicates
        - source_sample_short_ids
        - plate_format
        - plate_name_prefix
        - reserved_wells
      properties:
        replicates:
          type: integer
        num_plates:
          type: integer
        num_blanks:
          type: integer
        strategy:
          type: string
        source_sample_short_ids:
          type: array
          items:
            type: string
        plate_format:
          type: string
        plate_name_prefix:
          type: string
        reserved_wells:
          type: array
          items:
            type: string

    TransferMapRequest:
      type: object
      required:
        - source_plate_id
        - destination_plate_ids
      properties:
        source_plate_id:
          type: integer
        destination_plate_ids:
          type: array
          items:
            type: integer

    Plate:
      type: object
      properties:
        id:
          type: integer
        uid:
          type: string
        short_id:
          type: string
        project_id:
          type: integer
        product_id:
          type: integer
        name:
          type: string
        plate_format:
          type: string
        category:
          type: string
        created_at:
          type: number
        updated_at:
          type: number
    Sample:
      type: object
      properties:
        id:
          type: integer
        uid:
          type: string
        short_id:
          type: string
        project_id:
          type: integer
        sample_type:
          type: string
        status:
          type: string
        category:
          type: string
        parent_sample_id:
          type: integer
        strain_id:
          type: integer
        community_id:
          type: integer
        created_at:
          type: number
        updated_at:
          type: number

    SampleCreate:
      type: object
      required:
        - sample_type
      properties:
        sample_type:
          type: string
        category:
          type: string
        parent_sample_id:
          type: integer
        parent_sample_short_id:
          type: string
        strain_id:
          type: integer
        community_id:
          type: integer
        result_definition_ids:
          type: array
          items:
            type: integer
        genus:
          type: string
        species:
          type: string
        strain_name:
          type: string
        genotype:
          type: string

    SampleUpdate:
      type: object
      required:
        - sample_type
      properties:
        sample_type:
          type: string
        category:
          type: string
        parent_sample_id:
          type: integer
        strain_id:
          type: integer
        community_id:
          type: integer
        status:
          type: string

    SampleBulkCreateRequest:
      type: object
